name: CI

# The marketing site has its own gate (ci-www.yml) and shares no code with the
# app, so a website-only change does not need a macOS Rust compile.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/www/**'
      - 'infra/**'
  pull_request:
    paths-ignore:
      - 'apps/www/**'
      - 'infra/**'

permissions:
  contents: read

# Newer pushes to the same branch/PR cancel older, still-running jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend lint/format only — no Rust, no macOS frameworks, so it runs on cheap
  # Ubuntu on its own runner and answers in seconds instead of riding inside a
  # job that compiles.
  biome:
    name: Biome (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # One pnpm workspace, so install runs at the root and links every package.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome (lint + format)
        working-directory: apps/desktop
        run: pnpm exec biome check

  # macOS by construction: clippy compiles the whole workspace, including the
  # desktop crate that links macOS system frameworks. Runs in parallel with the
  # test job; sccache lets whichever job reaches a crate second read the object
  # instead of rebuilding it, so the two together cost about one compile.
  clippy:
    name: Clippy
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Clippy (workspace, default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (desktop app, export feature)
        run: cargo clippy -p msg2pdf-desktop --all-targets --features export -- -D warnings
      - name: sccache stats
        if: ${{ always() }}
        run: sccache --show-stats

  # macOS by construction: the tests shell out to `sips`, read the AddressBook,
  # and build the Tauri app against macOS frameworks. Independent of clippy — its
  # result is not an input to the lint gate — so it runs as its own parallel job
  # and reports the moment it knows.
  test:
    name: Test
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Test (workspace)
        run: cargo test --workspace
      - name: Test (desktop app, export feature — bindings drift)
        run: cargo test -p msg2pdf-desktop --features export
      - name: sccache stats
        if: ${{ always() }}
        run: sccache --show-stats
