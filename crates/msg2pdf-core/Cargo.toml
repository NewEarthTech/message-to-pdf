[package]
name = "msg2pdf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "iMessage/SMS chat.db → PDF export engine"
publish = false

[lib]
name = "msg2pdf_core"

[dependencies]
imessage-database = "=4.0.0"
rusqlite = { version = "=0.39.0", features = ["blob", "bundled"] }
chrono = { workspace = true }
printpdf = { version = "0.12", features = ["images", "jpeg", "png", "gif", "webp"] }
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
kamadak-exif = "0.6"
twemoji-assets = { version = "1.5", default-features = false, features = ["png"] }
unicode-segmentation = "1"
anyhow = { workspace = true }

[dev-dependencies]
msg2pdf-fixture = { path = "../msg2pdf-fixture" }
