name: Deploy www

# Continuous deployment for message-to-pdf.com: every push to main that touches
# the marketing site builds it and publishes to S3 + CloudFront. No AWS keys; the
# job assumes an OIDC role (infra/www/github-oidc.tf) whose trust is pinned to
# this repo's main branch. That role can write the site bucket and invalidate the
# distribution, and nothing else, so it can never touch a release artifact.
on:
  push:
    branches: [main]
    paths:
      - 'apps/www/**'
      - 'packages/ui/**'
      - '.github/workflows/deploy-www.yml'
  workflow_dispatch:

permissions:
  id-token: write # mint the OIDC token used to assume the AWS role
  contents: read

concurrency: deploy-www

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No-ops cleanly before AWS is wired up rather than failing the push.
    if: ${{ vars.AWS_WWW_DEPLOY_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # One pnpm workspace, so install runs at the root and links every package.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (live Paddle env)
        working-directory: apps/www
        env:
          PUBLIC_PADDLE_ENV: production
          # Public-safe live client token (live_…), from a repo variable so it is
          # never hard-coded in source. The build fails if the env/token pair is
          # missing or mismatched, so a sandbox token cannot ship to production.
          PUBLIC_PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
          # The entitlement-gated download endpoint. /success links to it with
          # ?_ptxn=<txn>; it verifies the purchase and redirects to a signed URL.
          PUBLIC_DOWNLOAD_ENDPOINT: ${{ vars.DOWNLOAD_ENDPOINT }}
        run: pnpm run build

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_WWW_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish to S3
        working-directory: apps/www
        env:
          BUCKET: ${{ vars.WWW_BUCKET }}
        run: |
          set -euo pipefail
          # Astro content-hashes everything under _astro/, so a given name never
          # changes contents and can be cached forever.
          aws s3 sync dist/ "s3://$BUCKET" --delete \
            --exclude "*" --include "_astro/*" \
            --cache-control "public, max-age=31536000, immutable"
          # The HTML documents and the verbatim public/ files keep stable names,
          # so they must always revalidate for a deploy to be visible.
          aws s3 sync dist/ "s3://$BUCKET" --delete \
            --exclude "_astro/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.WWW_DISTRIBUTION_ID }}" \
            --paths '/*'

      - name: Smoke test the live site
        run: |
          set -euo pipefail
          for path in / /pricing /faq /terms /privacy /refund \
              /export-text-messages-for-court \
              /save-text-messages-from-a-deceased-loved-one \
              /print-imessages-to-pdf \
              /sitemap-index.xml /robots.txt; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://message-to-pdf.com$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "expected 200 for $path"; exit 1; }
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://message-to-pdf.com/no-such-page")
          echo "/no-such-page -> $code"
          [ "$code" = "404" ] || { echo "expected a real 404, got $code"; exit 1; }
