version: 2
updates:
  # Keep the CI actions current — batched into one PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Rust workspace deps. Minor/patch batched; majors get their own PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: ["minor", "patch"]

  # Every frontend package (apps/desktop, apps/www, packages/ui) lives in ONE
  # pnpm workspace with a single lockfile at the repo root, so Dependabot has to
  # run at the root. Pointed at a package subdirectory it edits that
  # package.json but cannot update the root lockfile, and every install then
  # dies on ERR_PNPM_OUTDATED_LOCKFILE. That is what broke #43, #47 and #48.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7's native compiler does not expose the programmatic API
      # `astro check` uses, so apps/www cannot type-check .astro templates on it
      # and is held on 6. Keeping the checker beats matching version numbers.
      # Drop this when https://github.com/withastro/roadmap/discussions/1321
      # lands. (The desktop app is already on 7, which is current.)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
