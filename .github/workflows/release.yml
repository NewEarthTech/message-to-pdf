name: Release

# Two-stage release automation:
#   1. release-please watches conventional-commit history on main and opens/maintains
#      a "release PR" that bumps the version (tauri.conf.json + package.json + version.txt)
#      and updates CHANGELOG.md. Merging that PR tags the commit and creates a GitHub
#      release with generated notes.
#   2. When a release is cut, the publish job builds the signed + notarized universal
#      .dmg, uploads it to the download host (S3 + CloudFront), and appends a link to the
#      sales page to the release notes. No binary asset is attached to the GitHub release.
#
# Signing/notarization creds are NOT stored as GitHub secrets: the publish job assumes an
# AWS role via OIDC and pulls the shared Apple Developer ID secret from AWS Secrets Manager
# at runtime (same pattern + same secret as the lux and vegify pipelines). tauri-action
# imports the cert into a temporary keychain and notarizes with the App Store Connect API key.
#
# The two jobs live in one workflow on purpose: a GitHub release created with the default
# GITHUB_TOKEN cannot trigger a separate `release`-triggered workflow, so chaining the
# publish job off the release-please job's output avoids needing a personal access token.
#
# The publish job is inert until the AWS OIDC role variable is set (vars.AWS_RELEASE_ROLE_ARN).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild + re-publish to the download host (e.g. v1.0.0). Leave blank to build current main."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build, notarize & publish DMG
    needs: [release-please]
    # Run on a fresh release, or on manual dispatch; skip entirely until the AWS role is provisioned.
    if: >-
      always() &&
      vars.AWS_RELEASE_ROLE_ARN != '' &&
      (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    # macOS only by construction: the app links macOS system frameworks and the bundle is
    # signed + notarized with an Apple Developer ID.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a release: the tag release-please just created. On manual dispatch: the given
          # tag, or the default branch when left blank.
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Install Rust (stable) + Apple targets
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # One pnpm workspace, so install runs at the root and links every package
      # (the desktop app consumes packages/ui).
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Load the Apple Developer ID signing secret
        run: |
          set -euo pipefail
          s=$(aws secretsmanager get-secret-value --region us-west-1 --secret-id lux/apple-signing --query SecretString --output text)
          for k in certificate certificate_password api_key_id api_issuer_id; do
            echo "::add-mask::$(printf '%s' "$s" | jq -r ".$k")"
          done
          {
            echo "APPLE_CERTIFICATE=$(printf '%s' "$s" | jq -r '.certificate')"
            echo "APPLE_CERTIFICATE_PASSWORD=$(printf '%s' "$s" | jq -r '.certificate_password')"
            echo "APPLE_SIGNING_IDENTITY=$(printf '%s' "$s" | jq -r '.signing_identity')"
            echo "APPLE_TEAM_ID=$(printf '%s' "$s" | jq -r '.team_id')"
            echo "APPLE_API_ISSUER=$(printf '%s' "$s" | jq -r '.api_issuer_id')"
            echo "APPLE_API_KEY=$(printf '%s' "$s" | jq -r '.api_key_id')"
          } >> "$GITHUB_ENV"
          printf '%s' "$s" | jq -r '.api_key' > "$RUNNER_TEMP/asc_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize & staple the universal app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        with:
          projectPath: apps/desktop
          # No tagName/releaseId → build + sign + notarize only; nothing is attached to the release.
          args: --target universal-apple-darwin

      - name: Notarize, staple & verify the DMG
        id: dmg
        run: |
          set -euo pipefail
          DMG=$(printf '%s' '${{ steps.tauri.outputs.artifactPaths }}' | jq -r '.[] | select(endswith(".dmg"))' | head -1)
          test -n "$DMG" && test -f "$DMG"
          # tauri-action notarizes + staples the .app inside; the .dmg wrapper still needs its
          # own ticket so the downloaded file itself is notarized (offline-verifiable, no
          # Gatekeeper friction). Submit the dmg with the same App Store Connect API key.
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          spctl -a -vvv -t install "$DMG"
          lipo -info "target/universal-apple-darwin/release/bundle/macos/Message to PDF.app/Contents/MacOS/msg2pdf-desktop"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Publish the DMG to the download host
        env:
          DMG_PATH: ${{ steps.dmg.outputs.path }}
          VERSION: ${{ steps.dmg.outputs.version }}
          BUCKET: ${{ vars.DOWNLOAD_S3_BUCKET }}
        run: |
          set -euo pipefail
          # Versioned, product-namespaced key. The bucket has no public read path —
          # the DMG is served only through short-lived pre-signed URLs minted by the
          # download Lambda after it verifies a Paddle purchase, so the key is not a
          # secret and every release is retained for rollback.
          KEY="msg2pdf/${VERSION}/MessageToPDF_${VERSION}_universal.dmg"
          aws s3 cp "$DMG_PATH" "s3://$BUCKET/$KEY" \
            --content-type application/x-apple-diskimage --only-show-errors
          # Repoint the download Lambda at this release (no redeploy needed; rolling
          # back is just setting this pointer to a previous version's key).
          aws ssm put-parameter --name /msg2pdf/current-download-key --type String \
            --value "$KEY" --overwrite --query 'Version' --output text

      - name: Append the sales-page link to the release notes (no asset attached)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          SALES_URL="${{ vars.SALES_PAGE_URL }}"
          SALES_URL="${SALES_URL:-https://newearth.llc/pricing}"
          BODY=$(gh release view "$TAG" --json body -q .body)
          printf '%s\n\n---\n\n**[Get Message to PDF →](%s)** — signed, notarized, universal; one-time purchase.\n' \
            "$BODY" "$SALES_URL" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: sccache stats
        if: ${{ always() }}
        run: sccache --show-stats
